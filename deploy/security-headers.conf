# img-src : Open Library ne sert qu'une partie des couvertures elle-même, les
# autres partent en 302 vers archive.org puis vers un miroir iaNNNNNN.us.archive.org
# (hôte variable, d'où le joker). La CSP s'applique à CHAQUE saut de redirection :
# sans ces deux sources, une couverture de livre sur deux est bloquée en prod.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://image.tmdb.org https://images.igdb.com https://covers.openlibrary.org https://archive.org https://*.us.archive.org; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
