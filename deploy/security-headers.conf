# img-src : Open Library ne sert qu'une partie des couvertures elle-même, les
# autres partent en 302 vers archive.org puis vers un miroir iaNNNNNN.us.archive.org
# (hôte variable, d'où le joker). La CSP s'applique à CHAQUE saut de redirection :
# sans ces deux sources, une couverture de livre sur deux est bloquée en prod.
#
# connect-src : les deux CDN d'affiches y figurent AUSSI, et ce n'est pas un
# doublon d'img-src. Un service worker hérite de la CSP servie avec son propre
# script (/sw.js) et ses fetch() relèvent de connect-src, jamais d'img-src. Le
# runtimeCaching workbox (vite.config.ts) intercepte les vignettes TMDB/IGDB :
# avec « connect-src 'self' » seul, la requête du SW était bloquée et la page
# ne voyait qu'un ERR_FAILED — toutes les jaquettes de jeux, films et séries
# cassées, tandis que les couvertures de livres (non interceptées) passaient.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://image.tmdb.org https://images.igdb.com https://covers.openlibrary.org https://archive.org https://*.us.archive.org; connect-src 'self' https://image.tmdb.org https://images.igdb.com; worker-src 'self'; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
